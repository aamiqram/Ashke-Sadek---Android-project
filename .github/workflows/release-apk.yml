name: Publish signed Android release

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: ashke-shadek-signed-release
  cancel-in-progress: false

jobs:
  publish:
    # A push to main or a pull-request build must never publish a user-facing APK.
    # A maintainer must explicitly dispatch the build workflow on main to release.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && vars.ASHKE_STABLE_RELEASE_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository for GitHub CLI context
        uses: actions/checkout@v5

      - name: Confirm permanent signing secrets exist
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ASHKE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ASHKE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASHKE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASHKE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Publishing remains disabled: permanent signing secrets are missing."
          fi

      - name: Set up JDK 21
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download permanently signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ashke-shadek-signed-release-apk
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare APK, metadata manifest and checksum
        if: steps.signing.outputs.configured == 'true'
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + RUN_NUMBER))
          VERSION_NAME="1.1.${RUN_NUMBER}-beta"
          TAG="v${VERSION_NAME}"
          APK_SOURCE="$(find release-assets -type f -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"
          APK_NAME="Ashke-Shadek-${VERSION_NAME}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          APK_SHA="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"
          CERT_SHA="$(keytool -printcert -jarfile "$APK_NAME" | awk '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')"
          if [[ ! "$CERT_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not extract the APK signing certificate fingerprint."
            exit 1
          fi
          printf '%s  %s\n' "$APK_SHA" "$APK_NAME" > SHA256SUMS.txt
          APK_URL="https://github.com/${GH_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA" \
            --arg certificateSha256 "$CERT_SHA" \
            --arg releaseNotes "ভয়েস সার্ভিস এখন মডেল লোডের সময় ফোরগ্রাউন্ড র্যাঙ্কে থাকে—কম মেমরির ফোনেও লোডের মধ্যে বন্ধ হয় না, বন্ধ হলে একবার নীরব পুনঃচেষ্টা হয়। পুরোনো অ্যান্ড্রোয়েডের জন্য আধুনিক রুট-সার্টিফিকেট বান্ডেল করা হয়েছে—আপডেট পরীক্ষায় SSL ত্রুটি দূর। আপডেট পরীক্ষা এখন বেশি নির্ভরযোগ্য — আগে CDN মিরর, পরে GitHub API, ব্যর্থ হলে আসল কারণ দেখায়। পড়ার পাতা এখন বইয়ের মতো চওড়া; মুদ্রিত লাইন প্রয়োজনে সামান্য ছোট করে এক লাইনে ফিট করা হয়, ফলে অকারণ লাইনভাঙা প্রায় শেষ।" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,certificateSha256:$certificateSha256,releaseNotes:$releaseNotes}' \
            > update.json
          cat > release-notes.md <<EOF
          ## এশকে ছাদেক Android — ${VERSION_NAME}

          - Voice search now runs the isolated recognizer as a foreground service (with a small ongoing "listening" notification) so memory keepers cannot reclaim it during model load on low-RAM phones; a process death mid-session gets one silent automatic retry before the user is asked to try again.
          - Update checks bundle the modern root certificates (Let's Encrypt, GlobalSign, DigiCert, Google Trust Services, USERTrust) alongside the system store, so old Android 5-7 trust stores can verify GitHub's current HTTPS chains — this fixes the "trust anchor not found" SSL failure seen on devices like the Redmi Note 4.
          - Update checks now try a CDN-mirrored manifest first (no GitHub API quota), then the API with one retry; a failed check explains the actual cause (DNS, SSL, timeout, HTTP 403 rate limit).
          - The reading column is wider (432dp) and each printed line gently fits the column instead of wrapping mid-sentence; font-size controls still work.
          - The offline voice decoder now carries the songbook's own vocabulary: 3,952 hotword phrases (titles, first-line windows, rare words) generated from the catalogue steer beam search, so sung titles and familiar lines resolve far more often.
          - A Unicode spelling bridge aligns what the microphone hears with how the book spells it (decomposed nukta letters, ৰ/ৱ, stray marks), and unchanged partial results no longer cross the process boundary, keeping decoding realtime on older phones.
          - Bengali offline voice recognition uses the compact int8 streaming model in an isolated short-lived process.
          - The app verifies the APK checksum and signer before installation; Android asks to confirm the update.
          EOF
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Create or refresh signed beta release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" update.json SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "এশকে ছাদেক Android — $VERSION_NAME" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK_NAME" update.json SHA256SUMS.txt \
              --title "এশকে ছাদেক Android — $VERSION_NAME" --prerelease --notes-file release-notes.md
          fi

      - name: Mirror update.json to the raw update-mirror branch
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Serve the manifest from raw.githubusercontent.com (CDN, no API quota):
          # the app checks this first, so shared IPs never exhaust GitHub's limit.
          git config user.name "ashke-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan mirror-tmp
          git reset
          git add update.json
          git commit -m "Mirror update.json for ${VERSION_NAME}"
          git push --force origin HEAD:update-mirror
