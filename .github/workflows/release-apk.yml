name: Publish signed Android release

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: ashke-shadek-signed-release
  cancel-in-progress: false

jobs:
  publish:
    # A push to main or a pull-request build must never publish a user-facing APK.
    # A maintainer must explicitly dispatch the build workflow on main to release.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && vars.ASHKE_STABLE_RELEASE_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository for GitHub CLI context
        uses: actions/checkout@v5

      - name: Confirm permanent signing secrets exist
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ASHKE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ASHKE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASHKE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASHKE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Publishing remains disabled: permanent signing secrets are missing."
          fi

      - name: Set up JDK 21
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download permanently signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ashke-shadek-signed-release-apk
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare APK, metadata manifest and checksum
        if: steps.signing.outputs.configured == 'true'
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + RUN_NUMBER))
          VERSION_NAME="1.1.${RUN_NUMBER}-beta"
          TAG="v${VERSION_NAME}"
          APK_SOURCE="$(find release-assets -type f -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"
          APK_NAME="Ashke-Shadek-${VERSION_NAME}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          APK_SHA="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"
          CERT_SHA="$(keytool -printcert -jarfile "$APK_NAME" | awk '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')"
          if [[ ! "$CERT_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not extract the APK signing certificate fingerprint."
            exit 1
          fi
          printf '%s  %s\n' "$APK_SHA" "$APK_NAME" > SHA256SUMS.txt
          APK_URL="https://github.com/${GH_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          RELEASE_NOTES="আপডেট ডাউনলোড এখন অনেক দ্রুত: একযোগে ৪টি সংযোগে ভাগ করে নামানো হয়, সংযোগ বাধা পেলে যেখানে থেমেছিল সেখান থেকেই পুনরায় চেষ্টা হয়, আর বিজ্ঞপ্তিতে শতকরা হার দেখা যায়। GitHub-এর পাশাপাশি raw CDN মিরর থেকেও APK নামানোর পথ যোগ হয়েছে — ধীর রুট হলে অন্যটি ব্যবহৃত হয়। নতুন সংস্করণ পেলে বিজ্ঞপ্তি আসে; ট্যাপ করলেই ডাউনলোড ও ইনস্টলের নিশ্চিতকরণ খোলে। Android ৫-৭ (MIUI সহ)-এ ইনস্টল এখন Android-এর নিজস্ব ইনস্টলারের মাধ্যমে হয় — ইনস্টলের সময় যে নিশ্চিতকরণ চাওয়া হয় সেটি চাপ দিলেই হবে।"
          export RELEASE_NOTES
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" "$APK_SHA" "$CERT_SHA" "$PWD/update.json" <<'PY'
          import json, os, sys
          vc, vn, url, sha, cert, out = sys.argv[1:7]
          with open(out, "w", encoding="utf-8") as f:
              json.dump({
                  "versionCode": int(vc),
                  "versionName": vn,
                  "apkUrl": url,
                  "sha256": sha,
                  "certificateSha256": cert,
                  "releaseNotes": os.environ["RELEASE_NOTES"],
              }, f, ensure_ascii=False)
              f.write("\n")
          PY
          cat > release-notes.md <<EOF
          ## এশকে ছাদেক Android — ${VERSION_NAME}

          - Much faster update downloads: the APK is now pulled with 4 parallel range connections, a stalled or dropped connection resumes from where it stopped instead of restarting the whole file, and a shade notification shows the download percentage.
          - The APK is also mirrored on the raw CDN branch beside update.json; if one route is slow for an ISP, the updater automatically falls back to the other. Every download is still SHA-256 and signer verified before install.
          - New-update discoverability: every background check that finds a newer release posts a shade notification; tapping it opens the app and always offers download-and-install, even for a release dismissed earlier.
          - In-app self-update on Android 5-7 (MIUI included) now goes through Android's own installer UI, so MIUI's programmatic-install rejection no longer blocks updates on devices like the Redmi Note 4.
          - Bold initials of the original book are restored and ride slightly larger than the body text; lyric panels got a frosted, freezer-cold glass redesign that renders identically back to Android 5.
          EOF
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Create or refresh signed beta release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" update.json SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "এশকে ছাদেক Android — $VERSION_NAME" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK_NAME" update.json SHA256SUMS.txt \
              --title "এশকে ছাদেক Android — $VERSION_NAME" --prerelease --notes-file release-notes.md
          fi

      - name: Mirror update.json to the raw update-mirror branch
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Serve the manifest from raw.githubusercontent.com (CDN, no API quota):
          # the app checks this first, so shared IPs never exhaust GitHub's limit.
          git config user.name "ashke-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan mirror-tmp
          git reset
          git add update.json "$APK_NAME"
          git commit -m "Mirror update.json and the APK for ${VERSION_NAME}"
          git push --force origin HEAD:update-mirror
