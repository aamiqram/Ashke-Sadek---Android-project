plugins { id 'com.android.application' }

def sherpaVersion='2.0.1'
def sherpaAar=layout.buildDirectory.file("offline-dependencies/sherpa-onnx-${sherpaVersion}.aar")
def generatedVoiceAssets=layout.buildDirectory.dir("generated/offline-voice-assets")
def modelFolder='sherpa-onnx-bn-vosk-int8-19d0fc5'
def modelBaseUrl='https://huggingface.co/bbbipul/vosk-small-streaming-bn-int8/resolve/19d0fc5'

android {
    namespace 'org.ashkeshadek.reader'
    compileSdk 36
    defaultConfig {
        applicationId 'org.ashkeshadek.reader'
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName '1.1.0-beta'
    }
    sourceSets { main { assets.srcDir(layout.buildDirectory.dir('generated/offline-voice-assets').get().asFile) } }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' }
        debug { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging {
        jniLibs {
            // This is a phone-only distribution; omit emulator/desktop CPU libraries.
            excludes += ['**/lib/x86/**', '**/lib/x86_64/**']
        }
        resources { excludes += ['META-INF/DEPENDENCIES'] }
    }
}
dependencies {
    implementation files(sherpaAar)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.20'
}
tasks.register('prepareOfflineVoiceAssets') {
    group='build setup'
    description='Downloads and verifies pinned Bengali offline ASR runtime and model.'
    outputs.dir(generatedVoiceAssets)
    outputs.file(sherpaAar)
    doLast {
        def downloadFile={String url,File destination->
            if(destination.exists()&&destination.length()>0)return
            destination.parentFile.mkdirs()
            File partial=new File(destination.parentFile,destination.name+'.part');partial.delete()
            def connection=new URL(url).openConnection()
            connection.setConnectTimeout(45000);connection.setReadTimeout(300000)
            connection.setRequestProperty('User-Agent','AshkeShadek-Android-Build/1.0')
            connection.getInputStream().withCloseable{input->
                partial.withOutputStream{output->
                    byte[] buffer=new byte[1024*1024];int count
                    while((count=input.read(buffer))!=-1)output.write(buffer,0,count)
                }
            }
            if(!partial.exists()||partial.length()==0)throw new GradleException("Empty download: ${url}")
            if(!partial.renameTo(destination)){
                java.nio.file.Files.move(partial.toPath(),destination.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        def sha256={File file->
            def digest=java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream{input->
                byte[] buffer=new byte[1024*1024];int count
                while((count=input.read(buffer))!=-1)digest.update(buffer,0,count)
            }
            digest.digest().collect{String.format('%02x',it)}.join()
        }
        File aar=sherpaAar.get().asFile
        downloadFile("https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaVersion}/sherpa-onnx-${sherpaVersion}.aar",aar)
        if(sha256(aar)!='a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7'){
            aar.delete();throw new GradleException('sherpa-onnx AAR SHA-256 mismatch.')
        }
        File licenseSource=new File(layout.buildDirectory.get().asFile,'offline-dependencies/APACHE-2.0.txt')
        downloadFile('https://www.apache.org/licenses/LICENSE-2.0.txt',licenseSource)
        File modelSource=new File(layout.buildDirectory.get().asFile,'offline-quantized-bengali-model')
        modelSource.mkdirs()
        def modelFiles = [
                [name:'encoder.int8.onnx', sha:'8457d3a60b2baf0cf98079f3480ef7f192f62b0f7c6312dd181f9cf36869449a', min:20L*1024L*1024L],
                [name:'decoder.onnx', sha:'fc03e8ca154593b95748198a56de115d4e6048d97c41692f93dfefb05f3693b4', min:1024L*1024L],
                [name:'joiner.int8.onnx', sha:'2b2a22fbe5b79b0c900541f10cff1ac5518bd210e4c127cd647a31d8b286e25d', min:100L*1024L],
                [name:'tokens.txt', sha:'', min:5000L]
        ]
        modelFiles.each { item ->
            File source=new File(modelSource,item.name)
            downloadFile("${modelBaseUrl}/${item.name}",source)
            if(!source.isFile()||source.length()<item.min)
                throw new GradleException("Bengali int8 model file missing/incomplete: ${item.name}")
            if(item.sha && sha256(source)!=item.sha){
                source.delete()
                throw new GradleException("Bengali int8 model SHA-256 mismatch: ${item.name}")
            }
        }
        File destinationRoot=new File(generatedVoiceAssets.get().asFile,modelFolder)
        project.delete(destinationRoot)
        modelFiles.each { item ->
            File source=new File(modelSource,item.name)
            File destination=new File(destinationRoot,item.name)
            destination.parentFile.mkdirs()
            java.nio.file.Files.copy(source.toPath(),destination.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        File licenseDestination=new File(generatedVoiceAssets.get().asFile,'third_party/APACHE-2.0.txt')
        licenseDestination.parentFile.mkdirs()
        if(!licenseDestination.exists()||licenseDestination.length()!=licenseSource.length())
            java.nio.file.Files.copy(licenseSource.toPath(),licenseDestination.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Prepared bundled Bengali offline speech assets at ${generatedVoiceAssets.get().asFile}")
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareOfflineVoiceAssets') }
